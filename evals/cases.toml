# Casos da suíte de avaliação (SPEC-005, ticket 01). Cenário: warehouse.
#
# expect.status  status finais aceitos
# expect.place   lugar nomeado (ou expect.point [x, y]) onde exatamente um robô de
#                expect.robots precisa terminar quando a missão é `completed`;
#                sem destino, nenhum robô pode se mover
# expect.tools   ferramentas obrigatórias numa missão `completed`
# expect.forbidden  ferramentas que nunca podem ser chamadas
# expect.refusal o certo é não executar nada (conta em "recusas corretas")
#
# Robôs: tb1 e tb2 (MUUT), tb3 (FUUT, não se move). Uma ação por missão.
# Recusas aceitam `completed` porque um planejador LLM recusa respondendo texto.

# --- direta: o que o planejador precisa acertar sempre ------------------------

[[cases]]
id = "direta-doca"
category = "direta"
instruction = "leve o tb1 até a doca de carga"
expect = { status = ["completed"], robots = ["tb1"], place = "doca de carga", tools = ["move_robot", "wait_for_arrival"] }

[[cases]]
id = "direta-corredor-central"
category = "direta"
instruction = "mova o tb2 para o corredor central"
expect = { status = ["completed"], robots = ["tb2"], place = "corredor central", tools = ["move_robot", "wait_for_arrival"] }

[[cases]]
id = "direta-apelido"
category = "direta"
instruction = "mande o robô 1 para a sala noroeste"
expect = { status = ["completed"], robots = ["tb1"], place = "sala noroeste", tools = ["move_robot", "wait_for_arrival"] }

[[cases]]
