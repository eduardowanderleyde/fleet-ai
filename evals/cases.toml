expect = { status = ["completed"], robots = ["tb1"], place = "corredor da parede oeste", tools = ["move_robot", "wait_for_arrival"] }

[[cases]]
id = "direta-coordenada"
category = "direta"
instruction = "mova o tb1 para x 1,5 y 2"
expect = { status = ["completed"], robots = ["tb1"], point = [1.5, 2.0], tools = ["move_robot", "wait_for_arrival"] }

[[cases]]
id = "direta-onde-esta"
category = "direta"
instruction = "onde está o tb2?"
expect = { status = ["completed"], tools = ["get_robot_status"], forbidden = ["move_robot"] }

[[cases]]
id = "direta-status"
category = "direta"
instruction = "qual o status do tb1?"
expect = { status = ["completed"], tools = ["get_robot_status"], forbidden = ["move_robot"] }

[[cases]]
id = "direta-listar"
