[project]
name = "fleet-ai"
version = "0.1.0"
description = "Orquestração de frotas de robôs a partir de missões em linguagem natural, sem LLM pago."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "pillow>=11",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_ai", "src/simfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fleet_ai", "simfleet", "tests"]
