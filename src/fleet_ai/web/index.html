<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet AI — Control Center</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header>
    <h1>Fleet AI <span class="muted">— Control Center</span></h1>
    <p class="note">Planejador determinístico (por regras) · simulação 2D cinemática (SimFleet) · acesso local</p>
    <p id="connection" class="banner hidden" role="status"></p>
  </header>
  <main>
    <section class="map-panel" aria-label="Mapa">
      <div class="panel-title">
        <h2>Mapa</h2>
        <span id="map-note" class="muted"></span>
      </div>
      <canvas id="map" width="600" height="800" aria-label="Mapa do cenário com robôs e lugares"></canvas>
      <ul id="robots" class="robots"></ul>
    </section>
    <section class="side">
      <div class="panel" aria-label="Saúde">
        <h2>Saúde</h2>
        <dl id="health" class="health"></dl>
      </div>
      <div class="panel">
        <h2>Comando</h2>
        <form id="command">
          <label for="instruction">Instrução em português</label>
          <input id="instruction" name="instruction" maxlength="300" autocomplete="off"
                 placeholder="leve o tb1 até a doca de carga" required>
          <label for="robot">Escopo (opcional)</label>
          <select id="robot" name="robot"><option value="">nenhum</option></select>
          <button type="submit">Enviar</button>
          <p id="command-error" class="error" role="alert"></p>
        </form>
      </div>
      <div class="panel" aria-label="Missão">
        <h2>Missão</h2>
        <div id="mission" class="mission"><p class="muted">Nenhuma missão selecionada.</p></div>
      </div>
      <div class="panel" aria-label="Histórico">
        <h2>Histórico</h2>
        <ol id="history" class="history"></ol>
      </div>
    </section>
  </main>
</body>
</html>
